<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ECOGEST — Connexion requise</title>
  <meta name="theme-color" content="#0f2b5c">
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(15, 43, 92, 0.08), 0 8px 10px -6px rgba(15, 43, 92, 0.04);
      border: 1px solid #e2e8f0;
    }
    .logo-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #0f2b5c 0%, #1e40af 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px -4px rgba(15, 43, 92, 0.3);
    }
    .logo-container svg {
      width: 42px;
      height: 42px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f2b5c;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fee2e2;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #dc2626;
      border-radius: 50%;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #0f2b5c;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: #1e3a8a;
    }
    .notice {
      margin-top: 20px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 20 L22 36 L50 52 L78 36 Z" fill="#ffffff" />
        <path d="M30 42 L30 58 Q50 70 70 58 L70 42" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
        <line x1="78" y1="36" x2="78" y2="54" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
        <circle cx="78" cy="56" r="3" fill="#ffffff" />
        <circle cx="50" cy="74" r="6" fill="#38bdf8" />
      </svg>
    </div>

    <div class="status-badge">
      <span class="status-dot"></span>
      Connexion Internet interrompue
    </div>

    <h1>ECOGEST n'est pas accessible</h1>
    <p>
      Les données scolaires et de gestion sont sécurisées et nécessitent une connexion active avec le serveur. Vérifiez votre réseau Wi-Fi ou vos données mobiles.
    </p>

    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Réessayer la connexion
    </button>

    <div class="notice">
      ECOGEST • Système de Gestion Scolaire Sécurisé
    </div>
  </div>
</body>
</html>
